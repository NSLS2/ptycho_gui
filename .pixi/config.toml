#[detached-environments]
#enabled = true

#[cache]
# 1. Direct everyone to download packages to the same shared disk area
#dir = "/nsls2/data2/hxn/legacy/users/data_analysis/Ptychography/pixi-cache"

# 2. Pin detached environments to automatically isolate based on username
