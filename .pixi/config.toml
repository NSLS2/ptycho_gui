# Shared NFS: large conda packages (safe for concurrent reads/writes)
conda-packages = "/nsls2/data2/hxn/legacy/users/data_analysis/Ptychography/pixi-cache/pkgs"
repodata       = "/nsls2/data2/hxn/legacy/users/data_analysis/Ptychography/pixi-cache/repodata"


